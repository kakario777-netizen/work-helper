name: 윈도우 프로그램 빌드

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 버전 정하기
        id: ver
        shell: bash
        run: |
          V="1.3.${{ github.run_number }}"
          echo "ver=$V" >> "$GITHUB_OUTPUT"
          echo "VERSION = \"$V\"" > version.py

      - name: 라이브러리 설치 (실행기 직접 컴파일 - 백신 오진 줄이기)
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          pip install -r requirements.txt
          pip install --no-binary pyinstaller pyinstaller

      - name: 동작 확인
        run: python app.py --selftest
        timeout-minutes: 3

      - name: 버전 정보 파일
        shell: python
        run: |
          v = open("version.py").read().split('"')[1]
          a, b, c = (v.split(".") + ["0", "0", "0"])[:3]
          open("version_info.txt", "w", encoding="utf-8").write(f"""
          VSVersionInfo(
            ffi=FixedFileInfo(filevers=({a},{b},{c},0), prodvers=({a},{b},{c},0), mask=0x3f, flags=0x0,
                              OS=0x40004, fileType=0x1, subtype=0x0, date=(0, 0)),
            kids=[StringFileInfo([StringTable('041204B0', [
                StringStruct('CompanyName', 'kakario777'),
                StringStruct('FileDescription', 'WorkHelper - 업무 도우미'),
                StringStruct('FileVersion', '{v}'),
                StringStruct('InternalName', 'WorkHelper'),
                StringStruct('OriginalFilename', 'WorkHelper.exe'),
                StringStruct('ProductName', 'WorkHelper'),
                StringStruct('ProductVersion', '{v}'),
                StringStruct('LegalCopyright', 'kakario777')])]),
              VarFileInfo([VarStruct('Translation', [0x0412, 1200])])])
          """.replace("\n          ", "\n").strip())

      - name: 프로그램 만들기 (폴더형)
        run: >
          pyinstaller --noconfirm --onedir --windowed --noupx --name WorkHelper
          --version-file version_info.txt
          --collect-all tkinterdnd2
          app.py

      - name: 자동 업데이트 교체 확인
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "inst"
          New-Item -ItemType Directory -Force $d | Out-Null
          Start-Process -FilePath "dist\WorkHelper\WorkHelper.exe" -ArgumentList "--apply-update","$d","0","--no-restart" -Wait
          if (!(Test-Path (Join-Path $d "WorkHelper.exe"))) { Write-Error "교체 실패"; exit 1 }
          Get-ChildItem $d | Select-Object -First 5 | Format-Table Name

      - name: 압축
        shell: pwsh
        run: Compress-Archive -Path dist\WorkHelper -DestinationPath WorkHelper.zip

      - name: 릴리스에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.ver }}
          name: 업무 도우미 v${{ steps.ver.outputs.ver }}
          body: |
            ${{ github.event.head_commit.message }}

            ---
            처음 한 번만: WorkHelper.zip 을 받아 원하는 곳(예: 문서 폴더)에 압축을 풀고 WorkHelper 폴더 안의 WorkHelper.exe 실행.
            그다음부터는 프로그램 오른쪽 위 '업데이트 확인'으로 자동 업데이트됩니다.
          files: WorkHelper.zip
