name: 윈도우 프로그램 빌드

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 버전 정하기
        id: ver
        shell: bash
        run: |
          V="1.4.${{ github.run_number }}"
          echo "ver=$V" >> "$GITHUB_OUTPUT"
          echo "VERSION = \"$V\"" > version.py

      - name: 라이브러리 설치
        run: pip install -r requirements.txt nuitka ordered-set zstandard

      - name: 동작 확인 (소스)
        run: python app.py --selftest
        timeout-minutes: 3

      - name: Nuitka 캐시
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka
          key: nuitka-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: C로 컴파일 (Nuitka, 폴더형)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.ver }}"
          python -m nuitka --standalone --assume-yes-for-downloads --msvc=latest `
            --enable-plugin=tk-inter --windows-console-mode=disable `
            --include-package=tkinterdnd2 `
            --output-dir=build --output-filename=WorkHelper.exe `
            --company-name=kakario777 --product-name=WorkHelper `
            --file-description="WorkHelper" --copyright=kakario777 `
            --file-version="$v.0" --product-version="$v.0" `
            app.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force dist | Out-Null
          Move-Item build\app.dist dist\WorkHelper
          # 끌어다 놓기 부품(tkdnd)은 직접 복사
          $dnd = python -c "import tkinterdnd2, os; print(os.path.join(os.path.dirname(tkinterdnd2.__file__), 'tkdnd'))"
          Copy-Item -Recurse -Force $dnd dist\WorkHelper\tkinterdnd2\tkdnd
          Get-ChildItem dist\WorkHelper | Select-Object -First 15 | Format-Table Name, Length

      - name: 동작 확인 (완성된 프로그램)
        shell: pwsh
        timeout-minutes: 3
        run: |
          $log = Join-Path $env:RUNNER_TEMP "selftest.txt"
          Start-Process -FilePath "dist\WorkHelper\WorkHelper.exe" -ArgumentList "--selftest","--selftest-out","$log" -Wait
          Get-Content $log -Encoding utf8
          if (!(Select-String -Path $log -Pattern "selftest ok" -Quiet)) { Write-Error "완성된 프로그램 점검 실패"; exit 1 }
          if (!(Select-String -Path $log -Pattern "dnd: True" -Quiet)) { Write-Error "끌어다 놓기 부품 누락"; exit 1 }

      - name: 설치 파일 만들기
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.ver }}" installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Compress-Archive -Path dist\WorkHelper -DestinationPath WorkHelper.zip

      - name: 설치 확인
        shell: pwsh
        run: |
          Start-Process -FilePath "installer_out\WorkHelper_Setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          $exe = "$env:ProgramFiles\WorkHelper\WorkHelper.exe"
          if (!(Test-Path $exe)) { Write-Error "설치 실패"; exit 1 }
          Get-ChildItem "$env:PUBLIC\Desktop","$env:USERPROFILE\Desktop" -Filter *.lnk -ErrorAction SilentlyContinue | Format-Table Name
          (Get-Item $exe).VersionInfo | Format-List FileVersion, CompanyName, ProductName

      - name: 릴리스에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.ver }}
          name: 업무 도우미 v${{ steps.ver.outputs.ver }}
          body: |
            ${{ github.event.head_commit.message }}

            ---
            처음 설치: WorkHelper_Setup.exe 를 받아 실행 → Program Files 에 설치되고 바탕화면에 '업무 도우미' 바로가기가 생깁니다.
            이후 업데이트: 프로그램 오른쪽 위 '업데이트 확인'.
          files: |
            installer_out/WorkHelper_Setup.exe
            WorkHelper.zip
